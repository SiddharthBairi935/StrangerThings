name: Lucas database checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-smoke:
    name: PostgreSQL migrations and SQL assertions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lucas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply SQL migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            psql --host localhost --username postgres --dbname lucas_ci --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Run SQL assertions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for test_file in database/tests/*.sql; do
            psql --host localhost --username postgres --dbname lucas_ci --set ON_ERROR_STOP=1 --file "$test_file"
          done
