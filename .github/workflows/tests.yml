name: Eleven backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint Lucas coding modules
        run: |
          python -m pip install ruff
          ruff check app/coding_workspace.py app/delegation.py tests/test_brain.py tests/test_coding_workspace.py tests/test_lucas_engine.py tests/test_lucas_integration.py
